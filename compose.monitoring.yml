# Use alongside docker-compose.yml. The default receiver is a local rehearsal inbox.
services:
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox.yml"]
    volumes:
      - ./ops/monitoring/blackbox.yml:/etc/blackbox.yml:ro
    networks: [fitbitepal-network]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.1
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    networks: [fitbitepal-network]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/config.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - ${FITBITE_ALERTMANAGER_CONFIG:-./ops/monitoring/alertmanager.local.yml}:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    networks: [fitbitepal-network]
    restart: unless-stopped
  release-inbox:
    image: axllent/mailpit:v1.27.4
    ports: ["127.0.0.1:8026:8025"]
    networks: [fitbitepal-network]
    restart: unless-stopped
volumes:
  prometheus_data:
  alertmanager_data:
