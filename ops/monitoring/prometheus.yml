global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: fitbite-readiness
    scrape_timeout: 5s
    metrics_path: /probe
    params:
      module: [fitbite_ready]
    static_configs:
      - targets: ['http://backend:8080/api/actuator/health/readiness']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox:9115'
