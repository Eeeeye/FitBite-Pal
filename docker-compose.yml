# FitBite Pal - Docker Compose 配置
# 用于本地开发和测试环境

services:
  # ========================================
  # MySQL 数据库
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: fitbitepal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitbitepal}
      MYSQL_USER: ${MYSQL_USER:-fitbite_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a separate application database password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./FitBitePal-Backend/src/main/resources/db/baseline/mysql8.sql:/docker-entrypoint-initdb.d/01-fitbite-schema.sql:ro
    networks:
      - fitbitepal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis 缓存
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: fitbitepal-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fitbitepal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Spring Boot 后端
  # ========================================
  backend:
    build:
      context: ./FitBitePal-Backend
      dockerfile: Dockerfile
    container_name: fitbitepal-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-fitbitepal}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-fitbite_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set a separate application database password}
      
      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      
      # JPA 配置 (生产环境)
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "false"
      
      # JWT 配置 (请修改为安全的密钥)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a private signing key}
      FITBITE_ADMIN_EMAIL: ${FITBITE_ADMIN_EMAIL:-}
      FITBITE_ADMIN_PASSWORD: ${FITBITE_ADMIN_PASSWORD:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # 邮件配置
      FITBITE_DEFAULT_PROFILE: provider
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME:-noreply@fitbite.test}}
      
      # AI 配置
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_TIMEOUT: ${AI_TIMEOUT:-90000}
      ARK_API_KEY: ${ARK_API_KEY}
      ARK_MODEL: ${ARK_MODEL}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/coding/v3}
      ARK_ENABLED: ${ARK_ENABLED:-true}
      
      # 日志级别
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_FITBITEPAL: INFO
      
      # 时区
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - fitbitepal-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ========================================
# 数据卷
# ========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# ========================================
# 网络
# ========================================
networks:
  fitbitepal-network:
    driver: bridge

